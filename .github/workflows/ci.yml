name: Tooling checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify tooling
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -v

  device-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build disposable static arm64 probe
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir probe-artifact
          gcc -O2 -Wall -Wextra -Werror tools/susfs_probe.c -o /tmp/susfs-probe-host
          /tmp/susfs-probe-host denied
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra -Werror tools/susfs_probe.c -o probe-artifact/susfs_probe_arm64
          aarch64-linux-gnu-strip probe-artifact/susfs_probe_arm64
          cp tools/susfs_probe.c probe-artifact/
          PYTHONPATH=tools python3 - <<'PY'
          from pathlib import Path
          from build import run
          from common import profile
          from susfs import build_tool
          build_tool(profile('redfin-up1a-231105-001-b2-susfs'), Path('probe-artifact'), run)
          PY
          cd probe-artifact
          sha256sum susfs_probe_arm64 susfs_probe.c ksu_susfs_arm64 > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: susfs-device-probe
          path: probe-artifact/
          retention-days: 14
